<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }

    .page { display: none; height: 100vh; padding: 30px; }
    .active { display: flex; flex-direction: column; }

    /* Page 1: Home */
    #home-page { align-items: center; justify-content: center; text-align: center; }
    #home-page h1 { font-size: 3rem; margin-bottom: 20px; color: #38bdf8; }
    #home-page p { font-size: 1.2rem; color: #94a3b8; margin-bottom: 40px; }
    .home-buttons {display: flex; gap: 15px; align-items: center; justify-content: center; margin-top: 20px;}
    .btn-main { padding: 15px 35px; font-size: 1.2rem; font-weight: bold; background: #3b82f6; color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn-main:hover { background: #2563eb; transform: translateY(-2px) }
    .btn-exit { padding: 15px 35px; font-size: 1.2rem; font-weight: bold; background: #dc2626; /* Kırmızı renk */color: white; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn-exit:hover { background: #b91c1c; transform: translateY(-2px) }

    /* Page 2: Weekly To-Do View */
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .week-ctrl { display: flex; align-items: center; gap: 15px; }
    .btn-sec { padding: 8px 16px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .btn-sec:hover { background: #475569; }

    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; flex: 1; overflow-y: auto; }
    .day-card { background: #1e293b; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; border: 1px solid #334155; }
    .day-card h3 { font-size: 1.1rem; color: #38bdf8; text-align: center; }
    .day-card .date-sub { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 12px; }

    .todo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .todo-item { background: #334155; padding: 8px 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .todo-item.completed span { text-decoration: line-through; color: #94a3b8; }
    .todo-actions { display: flex; gap: 5px; }
    .btn-icon { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; }
    .btn-add-day { margin-top: 10px; padding: 8px; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.85rem; }
    .btn-add-day:hover { background: #10b981; }

    /* 3. Interface: Modal (Task Addition Window) */
    .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1e293b; padding: 25px; border-radius: 12px; width: 350px; border: 1px solid #475569; }
    .modal h2 { margin-bottom: 15px; font-size: 1.3rem; color: #38bdf8; }
    .modal input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
  </style>
</head>
<body>

  <!-- PAGE 1: WELCOME -->
  <div id="home-page" class="page active">
    <h1>Welcome Your Todo</h1>
    <p>Organize and track your tasks day by day.</p>
    <div class="home-buttons">
        <button class="btn-main" onclick="nextPage('todo-page')">Go to your todo</button>
        <button class="btn-exit" onclick="exitApp()">Exit</button>
    </div>
  </div>

  <!-- PAGE 2: WEEKLY TO-DO SCREEN -->
  <div id="todo-page" class="page">
    <div class="header-nav">
      <button class="btn-sec" onclick="nextPage('home-page')">← Back Home</button>
      <div class="week-ctrl">
        <button class="btn-sec" onclick="changeWeek(-1)">◄ Previous Week</button>
        <h2 id="week-range-text">Date Range</h2>
        <button class="btn-sec" onclick="changeWeek(1)">Next Week ►</button>
      </div>
      <div></div>
    </div>

    <!-- 7-Day Grid (Monday -> Sunday) -->
    <div class="days-grid" id="days-grid"></div>
  </div>

  <!-- 3. INTERFACE: ADDED/DELETED POPUP MODAL -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-date-title">Add Task</h2>
      <input type="text" id="todo-input" placeholder="Add Task">
      <input type="hidden" id="selected-date">
      <div class="modal-buttons">
        <button class="btn-sec" onclick="closeModal()">Cancel</button>
        <button class="btn-main" style="padding:8px 15px; font-size:0.9rem;" onclick="saveTodo()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let currentWeekOffset = 0;

    function nextPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      if (pageId === 'todo-page') {
        loadTodos();
      }
    }

    function exitApp() {
        pywebview.api.exit_app();
    }

    function changeWeek(direction) {
      currentWeekOffset += direction;
      loadTodos();
    }

    function loadTodos() {
      pywebview.api.get_week_todos(currentWeekOffset).then(data => {
        document.getElementById('week-range-text').innerText = data.week_range;
        const grid = document.getElementById('days-grid');
        grid.innerHTML = '';

        Object.keys(data.days).forEach(dateKey => {
          const dayData = data.days[dateKey];
          const info = dayData.info;

          let todosHtml = dayData.todos.map(t => `
            <div class="todo-item ${t.completed ? 'completed' : ''}">
              <span onclick="toggleTodo(${t.id})" style="cursor:pointer;">${t.title}</span>
              <div class="todo-actions">
                <button class="btn-icon" onclick="deleteTodo(${t.id})">✕</button>
              </div>
            </div>
          `).join('');

          const dayCard = document.createElement('div');
          dayCard.className = 'day-card';
          dayCard.innerHTML = `
            <h3>${info.day_name}</h3>
            <div class="date-sub">${info.display_date}</div>
            <div class="todo-list">${todosHtml}</div>
            <button class="btn-add-day" onclick="openModal('${dateKey}', '${info.day_name}')">+ Add Task</button>
          `;
          grid.appendChild(dayCard);
        });
      });
    }

    /* Modal işlemleri (3. Arayüz) */
    function openModal(dateStr, dayName) {
      document.getElementById('selected-date').value = dateStr;
      document.getElementById('modal-date-title').innerText = `${dayName} Add Task for`;
      document.getElementById('todo-input').value = '';
      document.getElementById('add-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('add-modal').classList.remove('active');
    }

    function saveTodo() {
      const title = document.getElementById('todo-input').value.trim();
      const dateStr = document.getElementById('selected-date').value;
      if (title) {
        pywebview.api.add_todo(title, dateStr).then(() => {
          closeModal();
          loadTodos();
        });
      }
    }

    function deleteTodo(id) {
      pywebview.api.delete_todo(id).then(() => loadTodos());
    }

    function toggleTodo(id) {
      pywebview.api.toggle_todo(id).then(() => loadTodos());
    }
  </script>
</body>
</html>
